<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Category Standard</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0E0F12;color:#F5F6F8;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
body{position:relative}
.wrap{padding:52px 20px 0}
.bar{display:flex;justify-content:space-between;font-size:22px;font-weight:600}
.card{margin-top:22px;background:#1A1C22;border-radius:24px;padding:22px;text-align:center}
.month{font-size:15px;color:#9CA1AE}
.total{font-size:48px;font-weight:700;margin-top:10px}
.count{font-size:15px;color:#9CA1AE;margin-top:6px}
.row{display:flex;justify-content:space-between;font-size:16px;margin:14px 0 6px}
.track{height:6px;background:#2a2d35;border-radius:3px}.track b{display:block;height:6px;background:#3D7BFF;border-radius:3px}
h3{font-size:22px;margin:24px 0 10px}
.item{display:flex;justify-content:space-between;background:#1A1C22;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.item small{display:block;color:#9CA1AE;font-size:14px;margin-top:2px}
.fab{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#3D7BFF;color:#fff;font-weight:600;font-size:18px;padding:17px 34px;border-radius:16px}
</style></head><body><div class="wrap">
  <div class="bar"><span>Spending</span><span>⚙</span></div>
  <div class="card"><div class="month">Ноябрь 2026</div><div class="total">HK$1,248.60</div><div class="count">23 purchases</div></div>
  <div class="card" style="text-align:left"><div class="row" style="margin-top:0"><span>Food</span><span>HK$612</span></div><div class="track"><b style="width:100%"></b></div><div class="row"><span>Transport</span><span>HK$388</span></div><div class="track"><b style="width:63%"></b></div></div>
  <h3>Purchases</h3>
  <div class="item"><div>Choose a category<small>6 нояб.</small></div><span>HK$49.17</span></div>
  <div class="item"><div>Food<small>6 нояб.</small></div><span>HK$7.76</span></div>
</div><div class="fab">+ Add</div></body></html>
