<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Grid Numerals</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:#F2F3F6;color:#101426;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
body{position:relative}
.plane{height:372px;background-color:#1D3BE0;color:#fff;padding:52px 24px 0;background-image:linear-gradient(#ffffff22 1px,transparent 1px),linear-gradient(90deg,#ffffff22 1px,transparent 1px);background-size:14px 14px}
.bar{display:flex;justify-content:space-between;font-size:22px;font-weight:700}
.month{display:flex;gap:18px;margin-top:20px;font-size:17px;font-weight:600}
.digits{display:flex;gap:7px;margin-top:30px;align-items:flex-end}
.digit{display:grid;grid-template-columns:repeat(4,14px);grid-auto-rows:14px}
.digit i{background:#fff}.digit i.o{background:transparent}
.small{font-size:30px;font-weight:700;margin-left:2px}
.count{font-size:17px;margin-top:14px}
.body{padding:20px 24px}
.row{display:flex;justify-content:space-between;font-size:16px;padding:9px 0;border-bottom:1px solid #d8dbe4}
h3{font-size:22px;margin:22px 0 6px}
.item{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #d8dbe4}
.item small{display:block;color:#5d6377;font-size:14px;margin-top:2px}
.fab{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#1D3BE0;color:#fff;font-weight:700;font-size:18px;padding:17px 34px}
</style></head><body>
<div class="plane">
  <div class="bar"><span>Spending</span><span>⚙</span></div>
  <div class="month"><span>‹</span><span>Ноябрь 2026</span><span style="opacity:.4">›</span></div>
  <div class="digits"><div class="digit"><i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i></i></div><div class="digit"><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i></i><i></i><i></i></div><div class="digit"><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i></div><div class="digit"><i></i><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i></i><i></i><i></i></div><span class="small">.60</span></div>
  <div class="count">HK$ · 23 purchases</div>
</div>
<div class="body">
  <div class="row"><span>Food</span><span>HK$612</span></div>
  <div class="row"><span>Transport</span><span>HK$388</span></div>
  <h3>Purchases</h3>
  <div class="item"><div>Choose a category<small>6 нояб. · $6.27</small></div><span>HK$49.17</span></div>
  <div class="item"><div>Food<small>6 нояб. · $0.99</small></div><span>HK$7.76</span></div>
</div>
<div class="fab">+ Add</div>
</body></html>
